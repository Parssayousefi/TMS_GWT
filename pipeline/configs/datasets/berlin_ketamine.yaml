
# Berlin Ketamine Dataset Configuration
# Ketamine vs Placebo with session structure

dataset_id: "berlin_ketamine"
name: "Berlin Ketamine Study"

# Data paths - supports both local Windows and HPC
paths:
  # Local Windows paths
  local:
    bids_root: "D:/projects/TMS_GWT/data/berlin_ketamine"
    fmriprep_dir: "D:/projects/TMS_GWT/data/berlin_ketamine/derivatives/fmriprep"
  # HPC paths (for future use)
  hpc:
    bids_root: "/home/s3648540/data_pi-michielvanelkm/Parsa/GWT/data/berlin_ketamine"
    fmriprep_dir: "/home/s3648540/data_pi-michielvanelkm/Parsa/GWT/data/berlin_ketamine/derivatives/fmriprep"
  # Legacy (for backward compatibility)
  bids_root: "D:/projects/TMS_GWT/data/berlin_ketamine"
  fmriprep_dir: "D:/projects/TMS_GWT/data/berlin_ketamine/derivatives/fmriprep"

# BIDS structure
bids_structure:
  has_sessions: true  # sub-XX/ses-Y/func/...

# Subject information
subjects:
  auto_discover: true
  include: []
  exclude: []

# Task/condition information
tasks:
  ketamine:
    bids_task_name: "rest" # Often BIDS task is 'rest' even if session is 'ketamine'
    description: "Ketamine condition"
    is_control: false
  
  placebo:
    bids_task_name: "rest"
    description: "Placebo condition"
    is_control: true

# Note: In this dataset, the 'condition' is determined by the SESSION name
# rather than the TASK name. The pipeline scripts might need to handle this.
# Example: sub-14/ses-ketamine/func/sub-14_ses-ketamine_task-rest_bold.nii.gz

# Run selection strategy
run_selection:
  strategy: "first"  # Assuming 1 run per session, or take the first

# File naming patterns
file_patterns: 
  bold: "sub-{subject}_ses-{session}_task-{task}_run-{run}_space-MNI152NLin2009cAsym_desc-preproc_bold.nii.gz"
  confounds: "sub-{subject}_ses-{session}_task-{task}_run-{run}_desc-confounds_timeseries.tsv"
  mask: "sub-{subject}_ses-{session}_task-{task}_run-{run}_space-MNI152NLin2009cAsym_desc-brain_mask.nii.gz"

# Quality control criteria (Luppi et al. methodology)
qc:
  # Motion thresholds for session exclusion
  motion_thresholds:
    max_translation_mm: 3.0  # Maximum translation in any axis
    max_rotation_deg: 3.15   # Maximum rotation in any axis
  # Salvage settings for truncation
  min_salvage_duration_min: 8.0  # Minimum clean segment duration
  auto_truncate: true  # true = auto-apply truncation, false = flag only
  # Legacy thresholds (for reference)
  max_fd_mean: 0.5
  max_fd_peak: 3.0
  min_timepoints: 100
  # Exclusions file (generated by QC script)
  exclusions_file: "results/qc/berlin_ketamine/exclusions.csv"

# Dataset-specific preprocessing overrides
# CRITICAL: Berlin Ketamine uses TR=3.4s, NOT the global default 2.0s
# Previously this was {} which fell back to the global default TR=2.0s (BUG)
# Any Berlin ketamine results processed with TR=2.0 need reprocessing
preprocessing:
  tr: 3.4  # 3400ms TR from BIDS JSON sidecars
  volumes_to_remove_last: 0  # Match Luppi: remove first N only, not last

# Notes
notes: |
  Berlin Ketamine study
  - 17 participants
  - 2 sessions: ses-ketamine, ses-placebo
  - Condition is defined by session name
