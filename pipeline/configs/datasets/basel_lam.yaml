
# Basel LAM Dataset Configuration
# LSD, Amphetamine, MDMA, Placebo — 28 subjects

dataset_id: "basel_lam"
name: "Basel LAM Study"

# Data paths
paths:
  local:
    bids_root: "D:/projects/TMS_GWT/data/basel_lam"
    fmriprep_dir: "D:/projects/TMS_GWT/data/basel_lam/derivatives/fmriprep"
  hpc:
    bids_root: "/home/s3648540/data_pi-michielvanelkm/ascdb/basel_LAM"
    fmriprep_dir: "/home/s3648540/data_pi-michielvanelkm/ascdb/basel_LAM/derivatives/fmriprep"
  # Legacy
  bids_root: "D:/projects/TMS_GWT/data/basel_lam"
  fmriprep_dir: "D:/projects/TMS_GWT/data/basel_lam/derivatives/fmriprep"

# BIDS structure
bids_structure:
  has_sessions: true  # sub-XXX/ses-{cond}/func/...

# Subject information
subjects:
  auto_discover: true
  include: []
  exclude: ["007"]

# Task/condition information
# Condition is determined by session name
tasks:
  lsd:
    bids_task_name: "rest"
    description: "LSD condition"
    is_control: false

  amph:
    bids_task_name: "rest"
    description: "Amphetamine condition"
    is_control: false

  mdma:
    bids_task_name: "rest"
    description: "MDMA condition"
    is_control: false

  placebo:
    bids_task_name: "rest"
    description: "Placebo condition"
    is_control: true

# Run selection
run_selection:
  strategy: "first"  # 1 run per session

# File naming patterns
file_patterns:
  bold: "sub-{subject}_ses-{session}_task-{task}_space-MNI152NLin2009cAsym_desc-preproc_bold.nii.gz"
  confounds: "sub-{subject}_ses-{session}_task-{task}_desc-confounds_timeseries.tsv"
  mask: "sub-{subject}_ses-{session}_task-{task}_space-MNI152NLin2009cAsym_desc-brain_mask.nii.gz"

# QC criteria (Luppi et al. methodology)
qc:
  motion_thresholds:
    max_translation_mm: 3.0
    max_rotation_deg: 3.15
  min_salvage_duration_min: 8.0
  auto_truncate: true
  max_fd_mean: 0.5
  max_fd_peak: 3.0
  min_timepoints: 100
  exclusions_file: "results/qc/basel_lam/exclusions.csv"

# Dataset-specific preprocessing overrides
preprocessing:
  tr: 1.8  # 1800ms TR from JSON sidecars
  volumes_to_remove_last: 0  # Match Luppi: remove first N only, not last

# Notes
notes: |
  Basel LAM study (Borgwardt/Preller/Vollenweider group)
  - 28 subjects (001-029, skip 023)
  - 4 conditions: LSD, Amphetamine, MDMA, Placebo
  - EPI: 300 volumes, 35 slices, 3.5mm iso, TR=1.8s, TE=28ms
  - B0 fieldmaps: magnitude (4D) + phasediff
  - Subject 007: Dropout in LSD session (mix-up, received placebo twice)
  - Subject 027: Extra dropout Amph session (medication mix-up)
  - JSON sidecars available for LSD and Placebo only; Amph/MDMA cloned
