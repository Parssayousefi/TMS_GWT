# Human Connectome Project - 100 Unrelated Subjects
# Used as healthy control baseline to define the synergistic workspace
# (gateways/broadcasters) following Luppi et al. 2022/2023

dataset_id: "hcp"
name: "Human Connectome Project - 100 Unrelated"

# Data paths
paths:
  local:
    bids_root: "D:/projects/TMS_GWT/data/hcp"
    fmriprep_dir: "D:/projects/TMS_GWT/data/hcp/derivatives/fmriprep"

# BIDS structure
bids_structure:
  has_sessions: false  # HCP has no session structure

# Subject information
subjects:
  auto_discover: true  # Discover from BIDS directory

# Task/condition information
# HCP healthy controls have only resting-state
tasks:
  rest:
    bids_task_name: "rest"
    description: "Resting-state fMRI (REST1_LR only, per Luppi methodology)"
    is_control: true

# Run selection
run_selection:
  strategy: "first"  # Only 1 run per subject (REST1_LR)

# File naming patterns (for fMRIPrep outputs - no sessions)
file_patterns:
  bold: "sub-{subject}_task-{task}_dir-LR_space-MNI152NLin2009cAsym_desc-preproc_bold.nii.gz"
  confounds: "sub-{subject}_task-{task}_dir-LR_desc-confounds_timeseries.tsv"
  mask: "sub-{subject}_task-{task}_dir-LR_space-MNI152NLin2009cAsym_desc-brain_mask.nii.gz"

# Quality control criteria
qc:
  motion_thresholds:
    max_translation_mm: 3.0
    max_rotation_deg: 3.15
  min_salvage_duration_min: 8.0
  auto_truncate: true  # Apply truncation for salvageable sessions
  max_fd_mean: 0.5
  max_fd_peak: 3.0
  min_timepoints: 100

# Dataset-specific preprocessing overrides
# CRITICAL: HCP uses TR=0.72s, NOT 2.0s like other datasets
preprocessing:
  tr: 0.72  # 720ms TR (HCP-specific, affects bandpass & HRF deconvolution)
  volumes_to_remove: 10
  volumes_to_remove_last: 0
  bandpass_low: 0.008
  bandpass_high: 0.09
  compcor_wm: 5
  compcor_csf: 5
  global_signal_regression: false

# Notes
notes: |
  HCP Young Adult 100 Unrelated Subjects (S1200 release)
  - 100 subjects, no sessions
  - REST1_LR only (per Luppi et al. 2022/2023 methodology)
  - TR = 0.72s (CRITICAL: different from other datasets)
  - Used to define synergistic workspace (healthy baseline)
  - Workspace applied as reference to psychedelic datasets
  - Original data: WU-Minn HCP Consortium Open Access
  - Citation: Van Essen et al. (2013) NeuroImage
